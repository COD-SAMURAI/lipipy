[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lipipy"
version = "0.1.0.dev0"
description = "Readable, verified, complexity-documented implementations of numerical methods, ML, DL, AI agents, quantum computing and quantitative finance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "COD-SAMURAI" }]
keywords = [
    "machine-learning", "deep-learning", "from-scratch", "research", "education",
    "numerical-methods", "quantum-computing", "quantitative-finance", "ai-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
ml = []
dl = ["torch>=2.2"]
backends = ["array-api-compat>=1.6"]
quantum = ["qiskit>=1.0"]
all = ["lipipy[ml,dl,backends]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/COD-SAMURAI/lipipy"
Issues = "https://github.com/COD-SAMURAI/lipipy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lipipy"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-ra --doctest-modules -m 'not complexity'"
markers = [
    "complexity: timing-based complexity checks (machine dependent; run with make complexity)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
ignore = ["N802", "N803", "N806"]  # allow ML-conventional X, W names

