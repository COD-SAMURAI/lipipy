[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lipipy"
version = "0.1.0.dev0"
description = "Readable, verified, complexity-documented implementations of numerical methods, ML, DL, AI agents, quantum computing and quantitative finance."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "COD-SAMURAI" }]
keywords = [
    "machine-learning", "deep-learning", "from-scratch", "research", "education",
    "numerical-methods", "quantum-computing", "quantitative-finance", "ai-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
ml = []
dl = ["torch>=2.2"]
backends = ["array-api-compat>=1.6"]
quantum = ["qiskit>=2.0"]
all = ["lipipy[ml,dl,backends]"]
# Reference libraries used only by parity tests (docs/dependencies.md §4).
test-reference = [
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "networkx>=3.3",
    "array-api-strict>=2.0",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "pennylane>=0.40",
    "QuantLib>=1.36",
    "arch>=7.0",
    "cvxpy>=1.6",
    "gymnasium>=1.0",
]
security = [
    "pip-audit>=2.10",
    "bandit>=1.9",
    "detect-secrets>=1.5",
    "pip-licenses>=5.5",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/COD-SAMURAI/lipipy"
Issues = "https://github.com/COD-SAMURAI/lipipy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lipipy"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-ra --doctest-modules -m 'not complexity'"
markers = [
    "complexity: timing-based complexity checks (machine dependent; run with make complexity)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]
ignore = ["N802", "N803", "N806"]  # allow ML-conventional X, W names

